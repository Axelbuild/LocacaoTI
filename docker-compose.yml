version: "3.9"

services:
  locacao_ti:
    build: .
    ports:
      - 8080:8080
    networks:
      - locacao_net
    
  locacao_db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: locacao_db
    networks:
      - locacao_net

networks:
  locacao_net:
    driver: bridge
